name: Propose release updates

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-update-proposals
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only trusted default-branch code may discover or publish updates.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      proposals: ${{ steps.releases.outputs.proposals }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Find releases and verify archive digests without executing them
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_releases.py check all --github-output

  propose:
    needs: discover
    if: needs.discover.outputs.proposals != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        proposal: ${{ fromJSON(needs.discover.outputs.proposals) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create a proposal if the package has no open update PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL: ${{ toJSON(matrix.proposal) }}
        run: python3 scripts/update_releases.py publish
